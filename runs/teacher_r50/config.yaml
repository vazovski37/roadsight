name: teacher_r50
model:
  backbone: resnet50
  pretrained: coco_fcos
  fpn_channels: 256
  head_convs: 4
  sem_channels: 128
  sem_from: p2
  tasks:
  - det
  - sem
data:
  root: data/bdd10k
  size:
  - 1280
  - 720
  train_scale:
  - 0.5
  - 1.0
  batch_size: 8
  workers: 5
train:
  epochs: 16
  lr: 0.0001
  weight_decay: 0.05
  warmup_iters: 500
  clip_grad: 10.0
  amp: bf16
  seed: 0
  loss:
    weighting: fixed
    sem_weight: 1.0
  distill: null
  prune: null
  init: null
eval:
  splits:
  - holdout
  - val
  dump: true
  score_thr: 0.05
  nms_iou: 0.6
  max_det: 100
  fusion:
    score_thr: 0.4
    fill_thr: 0.2
    stuff_area: 0.002
    thin_stuff_area: 0.0
